<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Short-Form Pipeline">
<title>Short-Form Pipeline</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#2a2c35"/></pattern><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f0883e"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient><radialGradient id="glow" cx="0.76" cy="0.5" r="0.5"><stop offset="0" stop-color="#6d5dfc" stop-opacity="0.30"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7085"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter></defs>
<rect width="1600" height="400" rx="18" fill="#16171d"/>
