<rect width="1600" height="400" rx="18" fill="url(#glow)"/>
<text x="80" y="160" font-size="84" font-weight="900" fill="url(#g)" letter-spacing="-2">Short-Form Pipeline</text>
<text x="84" y="214" font-size="27" font-weight="600" fill="#eceef4">From the day’s top story to a ready-to-publish short.</text>
<text x="84" y="254" font-size="19" fill="#9a9eac">Source discovery, scripting with two quality gates, word-timed voice and a renderer</text>
<text x="84" y="280" font-size="19" fill="#9a9eac">that shows the real source page while the voice quotes it. A human publishes.</text>
