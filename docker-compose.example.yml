# All services join one internal network. Nothing is published to the host:
# the orchestrator (n8n) reaches them by service name, e.g. http://tts:5502/tts
services:
  tts:
    build:
      context: ./services/tts
    container_name: tts
    restart: unless-stopped
    env_file:
      - ./services/tts/.env
    expose:
      - "5502"

  tts-fallback:
    build:
      context: ./services/tts-fallback
    container_name: tts-fallback
    restart: unless-stopped
    expose:
      - "5501"

  video-renderer:
    build:
      context: ./services/video-renderer
    container_name: video-renderer
    restart: unless-stopped
    env_file:
      - ./services/video-renderer/.env
    expose:
      - "8788"
